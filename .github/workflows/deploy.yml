name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy vault to Quartz content
        run: rm -rf $GITHUB_WORKSPACE/quartz/content && cp -r $GITHUB_WORKSPACE/vault $GITHUB_WORKSPACE/quartz/content

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        run: cd quartz && npm ci

      - name: Build Quartz
        run: |
          sed -i 's|baseUrl: "mrbnsn.github.io"|baseUrl: "mrbnsn.github.io/osgog-campaign-vault"|' quartz/quartz.config.ts
          cd quartz && npx quartz build

      - name: Debug build output
        run: |
          echo "=== content root (all) ===" && ls $GITHUB_WORKSPACE/quartz/content
          echo "=== index.md present? ===" && ls $GITHUB_WORKSPACE/quartz/content/index.md 2>&1
          echo "=== HTML files in public ===" && find $GITHUB_WORKSPACE/quartz/public -name "*.html" | head -20
          echo "=== public root ===" && ls $GITHUB_WORKSPACE/quartz/public
          echo "=== baseUrl ===" && grep baseUrl $GITHUB_WORKSPACE/quartz/quartz.config.ts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5