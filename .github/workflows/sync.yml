name: Daily Wiki Sync

on:
  schedule:
    - cron: '0 2 * * *'  # 2am UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run wiki sync
        run: python sync.py --no-pr

      - name: Report changes
        run: |
          echo "=== Changed files ==="
          git diff --stat vault/
          echo "=== New files ==="
          git ls-files --others --exclude-standard vault/

      - name: Commit and push if changed
        run: |
          git add vault/
          if git diff --cached --quiet vault/; then
            echo "No changes to commit."
          else
            git commit -m "Sync wiki export $(date +%Y-%m-%d)"
            git push origin main
          fi
